name: Deploy application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Configure SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          TARGET_HOST: ${{ secrets.TARGET_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$TARGET_HOST" >> ~/.ssh/known_hosts

      - name: Generate Ansible inventory
        env:
          TARGET_HOST: ${{ secrets.TARGET_HOST }}
          HOST_USER: ${{ secrets.HOST_USER }}
        run: |
          : "${TARGET_HOST:?TARGET_HOST secret is required}"
          : "${HOST_USER:?HOST_USER secret is required}"
          printf '[server]\n%s\n\n[server:vars]\nansible_user=%s\nansible_ssh_private_key_file=%s\n' \
          "$TARGET_HOST" "$HOST_USER" "$HOME/.ssh/id_rsa" > "$RUNNER_TEMP/inventory.ini"

      - name: Install Ansible
        run: |
          sudo apt update
          sudo apt install -y ansible-core

      - name: Run Ansible playbook
        run: cat "$RUNNER_TEMP/inventory.ini"
      - run: ansible-playbook -i "$RUNNER_TEMP/inventory.ini" ansible/site.yml