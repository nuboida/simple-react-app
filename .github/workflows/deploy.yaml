name: Deploy application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.TARGET_HOST }} >> ~/.ssh/known_hosts

      - name: Generate Ansible inventory
        env: 
          INVENTORY_FILE: ${{secrets.HOST_INVENTORY}}
        run: printf '%s\n' "$INVENTORY_FILE" > ~/inventory.ini

      - name: Install Ansible
        run: |
          sudo apt update
          sudo apt install -y ansible-core

      - name: Run Ansible playbook
        run: cat ~/inventory.ini
      - run: ansible-playbook -i ~/inventory.ini ansible/site.yml